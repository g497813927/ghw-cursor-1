<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-do</title>
    <style>
      :root {
        --paper: #f7f1e6;
        --ink: #1e1a16;
        --muted: #6f675e;
        --line: #e4d9c8;
        --card: #fffdf8;
        --accent: #1d6b4a;
        --accent-ink: #f4fff8;
        --danger: #8f332c;
        --shadow: 0 18px 50px rgba(62, 42, 18, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at top, #fff8ec 0%, transparent 42%),
          var(--paper);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      main {
        width: min(40rem, calc(100% - 2rem));
        margin: 3.5rem auto 4rem;
      }

      header h1 {
        margin: 0;
        font-family: Palatino, "Iowan Old Style", Georgia, serif;
        font-size: 3rem;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      header p {
        margin: 0.35rem 0 1.5rem;
        color: var(--muted);
      }

      .composer,
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        box-shadow: var(--shadow);
      }

      .composer {
        display: flex;
        gap: 0.6rem;
        padding: 0.7rem;
      }

      input[type="text"] {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 1.05rem;
        padding: 0.7rem 0.8rem;
      }

      input[type="text"]:focus {
        outline: none;
      }

      button,
      .filters button {
        font: inherit;
        cursor: pointer;
      }

      .composer button,
      .clear {
        border: 0;
        border-radius: 0.85rem;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 0.75rem 1rem;
      }

      .composer button:hover,
      .clear:hover {
        filter: brightness(1.08);
      }

      .notice {
        min-height: 1.4rem;
        margin: 0.6rem 0.2rem;
        color: var(--danger);
        font-size: 0.92rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0.2rem 0 0.8rem;
      }

      .count {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .filters {
        display: flex;
        gap: 0.25rem;
        padding: 0.2rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--line);
      }

      .filters button {
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        padding: 0.4rem 0.75rem;
      }

      .filters button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
      }

      .clear {
        background: transparent;
        color: var(--danger);
        padding: 0.4rem 0.2rem;
      }

      .clear:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .panel {
        overflow: hidden;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.75rem;
        align-items: center;
        padding: 0.95rem 1rem;
        border-top: 1px solid var(--line);
      }

      li:first-child {
        border-top: 0;
      }

      .check {
        width: 1.35rem;
        height: 1.35rem;
        accent-color: var(--accent);
      }

      .text {
        overflow-wrap: anywhere;
        line-height: 1.4;
      }

      li.done .text {
        color: var(--muted);
        text-decoration: line-through;
      }

      .delete {
        border: 0;
        background: transparent;
        color: var(--muted);
        border-radius: 0.6rem;
        padding: 0.35rem 0.55rem;
      }

      .delete:hover,
      .delete:focus-visible {
        color: var(--danger);
        background: #f8ebe8;
      }

      .empty {
        margin: 0;
        padding: 2rem 1.2rem;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        main {
          margin-top: 1.5rem;
        }

        header h1 {
          font-size: 2.4rem;
        }

        .toolbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>To-do</h1>
        <p>Items and their done state stay in this browser.</p>
      </header>

      <form class="composer" id="composer">
        <label class="visually-hidden" for="task">New to-do</label>
        <input id="task" type="text" name="task" maxlength="240" placeholder="Add something to do" autocomplete="off" required />
        <button type="submit">Add</button>
      </form>
      <p class="notice" id="notice" role="status"></p>

      <div class="toolbar">
        <p class="count" id="count">0 left</p>
        <div class="filters" role="group" aria-label="Filter">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
        <button class="clear" id="clear" type="button">Clear done</button>
      </div>

      <section class="panel" aria-label="To-do list">
        <ul id="list"></ul>
        <p class="empty" id="empty" hidden>Nothing here yet.</p>
      </section>
    </main>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

    <script>
      const STORAGE_KEY = "todos";
      const form = document.querySelector("#composer");
      const input = document.querySelector("#task");
      const list = document.querySelector("#list");
      const empty = document.querySelector("#empty");
      const count = document.querySelector("#count");
      const notice = document.querySelector("#notice");
      const clearButton = document.querySelector("#clear");
      const filterButtons = document.querySelectorAll("[data-filter]");

      const state = {
        todos: loadTodos(),
        filter: "all",
      };

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          showNotice("Write a to-do before adding it.");
          return;
        }
        state.todos.unshift({
          id: createId(),
          text,
          done: false,
        });
        input.value = "";
        showNotice("");
        persistAndRender();
        input.focus();
      });

      list.addEventListener("change", (event) => {
        const box = event.target.closest(".check");
        if (!box) return;
        const todo = findTodo(box.dataset.id);
        if (!todo) return;
        todo.done = box.checked;
        persistAndRender();
      });

      list.addEventListener("click", (event) => {
        const button = event.target.closest(".delete");
        if (!button) return;
        state.todos = state.todos.filter((todo) => todo.id !== button.dataset.id);
        persistAndRender();
      });

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.filter = button.dataset.filter;
          filterButtons.forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });
          render();
        });
      });

      clearButton.addEventListener("click", () => {
        state.todos = state.todos.filter((todo) => !todo.done);
        persistAndRender();
      });

      window.addEventListener("storage", (event) => {
        if (event.key !== STORAGE_KEY) return;
        state.todos = loadTodos();
        render();
      });

      render();

      function loadTodos() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.filter(isTodo);
        } catch {
          return [];
        }
      }

      function isTodo(item) {
        return (
          item &&
          typeof item.id === "string" &&
          typeof item.text === "string" &&
          typeof item.done === "boolean"
        );
      }

      function persistAndRender() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.todos));
          showNotice("");
        } catch {
          showNotice("This browser could not save the list.");
        }
        render();
      }

      function render() {
        const visible = state.todos.filter((todo) => {
          if (state.filter === "active") return !todo.done;
          if (state.filter === "done") return todo.done;
          return true;
        });
        const remaining = state.todos.filter((todo) => !todo.done).length;
        const doneCount = state.todos.length - remaining;

        list.replaceChildren(...visible.map(createItem));
        empty.hidden = visible.length > 0;
        empty.textContent =
          state.todos.length === 0
            ? "Nothing here yet. Add the first one above."
            : "Nothing matches this filter.";
        count.textContent = remaining === 1 ? "1 left" : `${remaining} left`;
        clearButton.disabled = doneCount === 0;
      }

      function createItem(todo) {
        const item = document.createElement("li");
        item.className = todo.done ? "done" : "";

        const box = document.createElement("input");
        box.className = "check";
        box.type = "checkbox";
        box.checked = todo.done;
        box.dataset.id = todo.id;
        box.setAttribute("aria-label", todo.done ? `Mark “${todo.text}” active` : `Mark “${todo.text}” done`);

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = todo.text;

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.type = "button";
        remove.dataset.id = todo.id;
        remove.textContent = "Delete";
        remove.setAttribute("aria-label", `Delete “${todo.text}”`);

        item.append(box, text, remove);
        return item;
      }

      function findTodo(id) {
        return state.todos.find((todo) => todo.id === id);
      }

      function createId() {
        if (window.crypto && typeof crypto.randomUUID === "function") {
          return crypto.randomUUID();
        }
        return `todo-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function showNotice(message) {
        notice.textContent = message;
      }
    </script>
  </body>
</html>
